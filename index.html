<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body data-theme="dark">
  <div class="wrapper">
    <h1 class="game-title">TETRIS <span class="game-subtitle">(Adaptación a cargo de Antonio)</span></h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="menu-main" class="menu">
          <button id="resume-btn" type="button">Reanudar</button>
          <button id="restart-btn" type="button">Reiniciar</button>
          <button id="controls-btn" type="button" class="secondary">Ver controles</button>
          <label class="level-select" for="start-level">
            <span>Nivel inicial</span>
            <select id="start-level"></select>
          </label>
          <p class="menu-hint">Se aplica en la próxima partida</p>
        </div>

        <div id="menu-controls" class="menu" hidden>
          <ul class="controls-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Espacio</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <button id="controls-back-btn" type="button" class="secondary">Volver</button>
        </div>
      </div>
    </div>

    <footer class="theme-footer">
      <label class="skin-picker" for="skin-select">
        <span class="skin-label">Skin</span>
        <select id="skin-select">
          <option value="retro">Retro</option>
          <option value="neon">Neón</option>
          <option value="pastel">Pastel</option>
          <option value="pixel">Pixel art</option>
        </select>
      </label>
      <button id="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema" aria-pressed="false">
        <span class="theme-option theme-option-light" aria-hidden="true">
          <span class="icon">☀️</span>
          <span class="theme-label">Cambiar a modo claro</span>
        </span>
        <span class="theme-option theme-option-dark" aria-hidden="true">
          <span class="icon">🦇</span>
          <span class="theme-label">Cambiar a modo oscuro</span>
        </span>
      </button>
    </footer>
  </div>

  <script src="game.js?v=8"></script>
</body>
</html>
